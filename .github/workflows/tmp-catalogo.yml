name: tmp-catalogo
# Temporary: downloads the USGS catalog for the Central America seismicity analysis
# and commits it to this branch. Only runs on branch tmp/catalogo.
on:
  push:
    branches: [tmp/catalogo]
    paths: ["analysis/fetch_stress.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: python3 analysis/fetch_stress.py
      - if: always()
        run: |
          git config user.name "catalogo-usgs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/stress
          git commit -m "Datos para el estudio de esfuerzos"
          git push
