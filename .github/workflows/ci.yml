name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run e2e

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: echo "::notice::$(flutter --version | head -1)"
      - name: Generate platform folders if missing
        run: python3 tool/setup_platforms.py
      - run: flutter pub get
      # Each step turns its errors into annotations, so they show up on the commit.
      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=machine --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          awk -F'|' 'NF>=8 && ($1=="ERROR" || $1=="WARNING") {printf "::%s file=app/%s,line=%s,col=%s::%s (%s)\n", ($1=="ERROR"?"error":"warning"), substr($4, length(ENVIRON["GITHUB_WORKSPACE"])+6), $5, $6, $8, $3}' analyze.txt
          if grep -q '^ERROR|' analyze.txt; then exit 1; fi
          [ $code -le 2 ] || { tail -20 analyze.txt | sed 's/^/::error::/'; exit 1; }
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || { grep -E "error|Error|Expected|Actual|FAILED" test.log | head -25 | sed 's/^/::error::/'; exit 1; }
      - name: Build Android (debug) to prove it compiles
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log || { grep -E "error|Error|What went wrong|e: |Execution failed|Could not" build.log | head -30 | sed 's/^/::error::/'; exit 1; }
